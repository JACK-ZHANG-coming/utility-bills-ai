<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水电费快捷计算</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            color: #1a1a1a;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        /* GitHub 图标 */
        .github-link {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f5f5f5;
            transition: all 0.25s ease;
            z-index: 10;
            text-decoration: none;
        }
        .github-link:hover { background: #24292f; }
        .github-link svg { width: 20px; height: 20px; fill: #555; transition: fill 0.25s ease; }
        .github-link:hover svg { fill: #ffffff; }

        /* Header */
        .header {
            padding: 28px 32px 16px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header .subtitle {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
        }

        /* ==================== Layout: Sidebar + Main ==================== */
        .body-layout {
            display: flex;
            min-height: 520px;
            position: relative;
        }

        /* ==================== Sidebar ==================== */
        .sidebar {
            flex-shrink: 0;
            width: 220px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: width 0.28s ease;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 0;
            border-right: none;
        }
        .sidebar.collapsed .sidebar-header,
        .sidebar.collapsed .room-list,
        .sidebar.collapsed .sidebar-footer {
            display: none;
        }

        .btn-expand-floating {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 10px 12px 8px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-16px) scale(0.92);
            white-space: nowrap;
        }
        .btn-expand-floating.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0) scale(1);
            animation: floatPulse 2.4s ease-in-out 0.6s infinite;
        }
        .btn-expand-floating:hover {
            background: #4f46e5;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: scale(1.05);
            animation: none;
        }
        .btn-expand-floating svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        @keyframes floatPulse {
            0%, 100% { box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4), 0 0 0 6px rgba(99, 102, 241, 0.12); }
        }

        .sidebar-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            min-height: 50px;
        }
        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-toggle-sidebar {
            width: 32px;
            height: 32px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-toggle-sidebar:hover {
            background: #6366f1;
            border-color: #6366f1;
            color: #ffffff;
        }
        .btn-toggle-sidebar svg {
            width: 18px;
            height: 18px;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
            position: relative;
        }
        .room-list-item:hover {
            background: #f1f5f9;
        }
        .room-list-item.active {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .room-list-item .room-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
            background: var(--badge-color, #6366f1);
        }

        .room-list-item .room-list-name {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            transition: opacity 0.2s ease;
        }
        .room-list-item.active .room-list-name {
            color: #4338ca;
            font-weight: 600;
        }

        .room-list-item .room-list-delete {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .room-list-item:hover .room-list-delete { opacity: 1; }
        .room-list-item .room-list-delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .room-list-item .room-list-delete:disabled {
            opacity: 0;
            pointer-events: none;
        }
        .room-list-item .room-list-delete svg {
            width: 13px;
            height: 13px;
        }

        .sidebar-footer {
            padding: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-add-room {
            width: 100%;
            padding: 10px 12px;
            border: 2px dashed #c7d2fe;
            border-radius: 10px;
            background: #f5f3ff;
            color: #6366f1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-add-room:hover {
            border-color: #6366f1;
            background: #ede9fe;
        }

        /* ==================== Main Area ==================== */
        .main-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-area .room-panel {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        /* Room Header */
        .room-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: var(--header-bg, #f5f5f5);
        }

        .room-header .room-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
            background: var(--badge-color, #6366f1);
        }

        .room-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s, background 0.2s;
            min-width: 50px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: text;
        }
        .room-name:hover {
            background: rgba(99, 102, 241, 0.08);
        }
        .room-name:focus {
            border-bottom-color: #6366f1;
            background: rgba(255, 255, 255, 0.6);
        }
        .edit-icon {
            color: #9ca3af;
            flex-shrink: 0;
        }

        .room-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-clear-room {
            padding: 5px 12px;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            background: #fef2f2;
            color: #dc2626;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-clear-room:hover {
            background: #fee2e2;
            border-color: #f87171;
            color: #b91c1c;
        }

        /* ==================== Tabs ==================== */
        .tabs {
            display: flex;
            padding: 12px 20px 0;
            gap: 6px;
        }
        .tab {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: #f5f5f5;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .tab:hover { background: #efefef; }
        .tab.active {
            background: #ffffff;
            font-weight: 600;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
        }
        .tab.active[data-tab="elec"] { color: #d97706; }
        .tab.active[data-tab="water"] { color: #0891b2; }
        .tab-icon { font-size: 16px; }

        /* Tab Content */
        .tab-content {
            display: none;
            padding: 20px 20px 24px;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== Form Rows ==================== */
        .form-row { margin-bottom: 16px; }
        .form-row.with-date {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .date-group { flex-shrink: 0; width: 140px; }
        .reading-group { flex: 1; min-width: 0; }

        .sidebar:not(.collapsed) ~ .main-area .form-row.with-date {
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }
        .sidebar:not(.collapsed) ~ .main-area .date-group,
        .sidebar:not(.collapsed) ~ .main-area .reading-group {
            width: 100%;
        }

        .field-label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            color: #1a1a1a;
            background: #ffffff;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .field-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .field-input:read-only {
            background: #f8f8f8;
            color: #888;
            cursor: not-allowed;
        }
        .field-input:read-only:focus {
            border-color: #e5e5e5;
            box-shadow: none;
        }

        .date-input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 14px;
            color: #1a1a1a;
            background: #ffffff;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .date-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .unit {
            position: absolute;
            right: 14px;
            font-size: 14px;
            color: #aaa;
            pointer-events: none;
            white-space: nowrap;
        }
        .input-wrap.has-unit .field-input { padding-right: 56px; }

        .auto-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #e0f2fe;
            color: #0284c7;
            margin-left: 6px;
            font-weight: 500;
            vertical-align: middle;
        }
        .auto-badge.manual {
            background: #fef3c7;
            color: #b45309;
        }

        /* ==================== Result Card ==================== */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .tab-content[data-type="elec"] .result-card {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 1px solid #fed7aa;
        }
        .tab-content[data-type="water"] .result-card {
            background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%);
            border: 1px solid #a5f3fc;
        }

        .result-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .result-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: color 0.2s ease;
        }
        .tab-content[data-type="elec"] .result-value { color: #c2410c; }
        .tab-content[data-type="water"] .result-value { color: #0e7490; }
        .result-value.empty { color: #ccc; }
        .result-formula {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
            min-height: 18px;
        }

        /* ==================== Save Status Bar ==================== */
        .save-status-bar {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }
        .save-status-bar .save-label {
            color: #64748b;
            font-weight: 500;
            white-space: nowrap;
        }
        .save-status-bar .save-time {
            color: #1e293b;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .save-status-bar .save-time.never {
            color: #94a3b8;
            font-weight: 400;
        }
        .save-status-bar .save-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        .save-status-bar .save-dot.saved { background: #22c55e; }

        /* ==================== Actions ==================== */
        .actions {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .actions-btns {
            display: flex;
            gap: 8px;
        }
        .btn-reset {
            padding: 7px 16px;
            border: 1.5px solid #e5e5e5;
            border-radius: 8px;
            background: #ffffff;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .btn-reset:hover {
            border-color: #ccc;
            color: #333;
            background: #f8f8f8;
        }
        .btn-save {
            padding: 7px 16px;
            border: 1.5px solid #3b82f6;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 500;
        }
        .btn-save:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
        .btn-save:active { transform: scale(0.96); }

        .save-indicator {
            font-size: 12px;
            color: #16a34a;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .save-indicator.show { opacity: 1; }

        .restore-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(26, 26, 26, 0.92);
            color: #fff;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .restore-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Hide number spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* ==================== Records Section ==================== */
        .records-section {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            overflow: hidden;
        }
        .records-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: #f9fafb;
        }
        .records-title {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .records-count {
            font-size: 12px;
            color: #9ca3af;
            font-weight: 400;
        }
        .btn-add-record {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border: 1.5px solid #3b82f6;
            border-radius: 8px;
            background: #ffffff;
            color: #3b82f6;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .btn-add-record:hover {
            background: #eff6ff;
        }
        .btn-add-record svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .records-list {
            padding: 8px 20px;
            max-height: 560px;
            overflow-y: auto;
        }
        .records-empty {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
            font-size: 14px;
        }
        .records-empty svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            stroke: #d1d5db;
        }

        .record-card {
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s ease;
        }
        .record-card:last-child { border-bottom: none; }
        .record-card:hover { background: #f9fafb; margin: 0 -20px; padding: 14px 20px; }

        .record-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .record-date {
            font-size: 15px;
            font-weight: 700;
            color: #1f2937;
        }
        .record-total {
            font-size: 18px;
            font-weight: 700;
            color: #3b82f6;
        }
        .record-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
            margin-bottom: 8px;
        }
        .record-detail-item {
            font-size: 13px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .record-detail-item .detail-label {
            color: #9ca3af;
            flex-shrink: 0;
        }
        .record-detail-item .detail-value {
            color: #374151;
            font-weight: 500;
        }
        .record-meter-period {
            grid-column: 1 / -1;
            padding: 6px 10px;
            background: #f0f9ff;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .record-meter-period .detail-value {
            color: #0369a1;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .record-remark {
            font-size: 12px;
            color: #9ca3af;
            padding: 6px 10px;
            background: #f9fafb;
            border-radius: 6px;
            margin-bottom: 10px;
            font-style: italic;
            display: none;
        }
        .record-remark.has-remark { display: block; }
        .record-card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: #cbd5e1;
        }
        .record-card-bottom .saved-at {
            color: #9ca3af;
        }
        .record-card-actions {
            display: flex;
            gap: 4px;
        }
        .btn-record-action {
            padding: 3px 10px;
            border: 1px solid #e5e7eb;
            border-radius: 5px;
            background: #ffffff;
            color: #6b7280;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;

    <script>
        // ==================== 配置 ====================
        const TABS = ['elec', 'water'];
        const TAB_CONFIG = {
            elec:  { icon: '⚡', label: '电费', meterLabel: '电表', unit: '度', priceUnit: '元/度', resultLabel: '应缴电费', usageLabel: '用电量', defaultPrice: '0.55' },
            water: { icon: '💧', label: '水费', meterLabel: '水表', unit: '吨', priceUnit: '元/吨', resultLabel: '应缴水费', usageLabel: '用水量', defaultPrice: '2.8' }
        };

        const ROOM_COLORS = [
            { headerBg: 'linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%)', badgeBg: '#6366f1' },
            { headerBg: 'linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%)', badgeBg: '#8b5cf6' },
            { headerBg: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', badgeBg: '#10b981' },
            { headerBg: 'linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%)', badgeBg: '#f59e0b' },
            { headerBg: 'linear-gradient(135deg, #ecfeff 0%, #cffafe 100%)', badgeBg: '#06b6d4' },
            { headerBg: 'linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%)', badgeBg: '#d946ef' },
            { headerBg: 'linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%)', badgeBg: '#ef4444' },
            { headerBg: 'linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%)', badgeBg: '#22c55e' },
        ];

        const ROOM_LIST_KEY = 'utility-bills-room-list';
        const ROOM_COUNTER_KEY = 'utility-bills-room-counter';
        const SELECTED_ROOM_KEY = 'utility-bills-selected-room';
        const SIDEBAR_COLLAPSED_KEY = 'utility-bills-sidebar-collapsed';
        const RECORDS_PREFIX = 'utility-bills-records';
        const PAGE_SIZE = 5;

        let roomList = [];
        let roomCounter = 0;
        let selectedRoomId = null;
        let currentRecordsPage = 1;
        let pendingDeleteRecordId = null;
        let pendingDeleteRoomId = null;

        // ==================== 存储键辅助函数 ====================
        function getStorageKey(prefix) {
            return `utility-bills-${prefix}`;
        }
        function getRoomNameKey(roomId) {
            return `utility-bills-${roomId}-name`;
        }
        function getRecordsKey(roomId) {
            return `${RECORDS_PREFIX}-${roomId}`;
        }

        // ==================== 工具函数 ====================
        function getToday() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function formatNumber(num) {
            if (num === 0) return '0';
            return parseFloat(num.toPrecision(12)).toString();
        }

        function formatMoney(num) {
            if (isNaN(num) || num === null) return '¥ 0';
            return '¥ ' + formatNumber(num);
        }

        function formatTimestamp(isoString) {
            const d = new Date(isoString);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            return `${y}-${m}-${day} ${h}:${min}`;
        }

        function getRoomName(roomId) {
            const saved = localStorage.getItem(getRoomNameKey(roomId));
            if (saved) return saved;
            const idx = roomList.indexOf(roomId);
            return `房间${idx >= 0 ? idx + 1 : '?'}`;
        }

        function getRoomIndex(roomId) {
            return roomList.indexOf(roomId);
        }

        function getRoomColor(roomId) {
            const idx = getRoomIndex(roomId);
            return ROOM_COLORS[idx % ROOM_COLORS.length];
        }

        // ==================== 记录存储 ====================
        function loadRecords(roomId) {
            try {
                const data = localStorage.getItem(getRecordsKey(roomId));
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('加载记录失败:', e);
                return [];
            }
        }

        function saveRecords(roomId, records) {
            localStorage.setItem(getRecordsKey(roomId), JSON.stringify(records));
        }

        function getRecordsFromPage(roomId, page) {
            const records = loadRecords(roomId);
            // 已按时间倒序排列（保存时插入到最前面）
            const start = (page - 1) * PAGE_SIZE;
            const pageRecords = records.slice(start, start + PAGE_SIZE);
            return {
                records: pageRecords,
                total: records.length,
                totalPages: Math.ceil(records.length / PAGE_SIZE) || 1
            };
        }

        // ==================== 记录 UI 渲染 ====================
        function renderRecords(roomId) {
            const container = document.getElementById('records-container');
            if (!container) return;

            const { records, total, totalPages } = getRecordsFromPage(roomId, currentRecordsPage);

            // 头部
            let html = `
            <div class="records-header">
                <div class="records-title">
                    <span>📋 缴费记录</span>
                    <span class="records-count">共 ${total} 条</span>
                </div>
                <button class="btn-add-record" onclick="openRecordModal('${roomId}')">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    新增记录
                </button>
            </div>`;

            // 列表
            if (records.length === 0) {
                html += `
                <div class="records-empty">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <p>暂无缴费记录</p>
                    <p style="font-size:12px;margin-top:4px;">保存水电费数据后将自动在此生成记录</p>
                </div>`;
            } else {
                html += '<div class="records-list">';
                records.forEach(r => {
                    const waterCost = r.waterCost || 0;
                    const elecCost = r.elecCost || 0;
                    const totalCost = waterCost + elecCost;
                    // 抄表日期周期展示
                    let meterPeriodHTML = '';
                    if (r.meterDateStart || r.meterDateEnd) {
                        const start = r.meterDateStart || '?';
                        const end = r.meterDateEnd || '?';
                        meterPeriodHTML = `<div class="record-detail-item record-meter-period">
                            <span class="detail-label">📅 抄表周期：</span>
                            <span class="detail-value">${start} ~ ${end}</span>
                        </div>`;
                    }
                    html += `
                    <div class="record-card">
                        <div class="record-card-top">
                            <span class="record-date">${r.date || '-'}</span>
                            <span class="record-total">${formatMoney(totalCost)}</span>
                        </div>
                        ${meterPeriodHTML}
                        <div class="record-details">
                            <div class="record-detail-item">
                                <span class="detail-label">💧 水费：</span>
                                <span class="detail-value">${formatMoney(waterCost)}${r.waterUsage ? ` (${formatNumber(r.waterUsage)}吨 × ${formatMoney(r.waterUnitPrice)})` : ''}</span>
                            </div>
                            <div class="record-detail-item">
                                <span class="detail-label">⚡ 电费：</span>
                                <span class="detail-value">${formatMoney(elecCost)}${r.elecUsage ? ` (${formatNumber(r.elecUsage)}度 × ${formatMoney(r.elecUnitPrice)})` : ''}</span>
                            </div>
                        </div>`;
                    if (r.remark) {
                        html += `<div class="record-remark has-remark">${escapeHTML(r.remark)}</div>`;
                    } else {
                        html += '<div class="record-remark"></div>';
                    }
                    html += `
                        <div class="record-card-bottom">
                            <span class="saved-at">保存于 ${r.savedAt ? formatTimestamp(r.savedAt) : '-'}</span>
                            <div class="record-card-actions">
                                <button class="btn-record-action edit" onclick="openRecordModal('${roomId}', '${r.id}')">编辑</button>
                                <button class="btn-record-action delete" onclick="showDeleteConfirm('${roomId}', '${r.id}')">删除</button>
                            </div>
                        </div>
                    </div>`;
                });
                html += '</div>';
            }

            // 分页
            if (totalPages > 1) {
                html += '<div class="records-pagination">';
                html += `<button class="pagination-btn" onclick="changeRecordPage('${roomId}', ${currentRecordsPage - 1})" ${currentRecordsPage <= 1 ? 'disabled' : ''}>&lt;</button>`;

                const maxVisible = 5;
                let startPage = Math.max(1, currentRecordsPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage < maxVisible - 1) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }

                if (startPage > 1) {
                    html += `<button class="pagination-btn" onclick="changeRecordPage('${roomId}', 1)">1</button>`;
                    if (startPage > 2) html += '<span class="pagination-info">...</span>';
                }

                for (let p = startPage; p <= endPage; p++) {
                    html += `<button class="pagination-btn ${p === currentRecordsPage ? 'active' : ''}" onclick="changeRecordPage('${roomId}', ${p})">${p}</button>`;
                }

                if (endPage < totalPages) {
                    if (endPage < totalPages - 1) html += '<span class="pagination-info">...</span>';
                    html += `<button class="pagination-btn" onclick="changeRecordPage('${roomId}', ${totalPages})">${totalPages}</button>`;
                }

                html += `<button class="pagination-btn" onclick="changeRecordPage('${roomId}', ${currentRecordsPage + 1})" ${currentRecordsPage >= totalPages ? 'disabled' : ''}>&gt;</button>`;
                html += '</div>';
            }

            container.innerHTML = html;
        }

        function changeRecordPage(roomId, page) {
            currentRecordsPage = page;
            renderRecords(roomId);
            // 滚动到记录列表区域
            const section = document.querySelector('.records-section');
            if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ==================== ID 生成 ====================
        function generateRecordId() {
            return 'rec_' + crypto.randomUUID();
        }
        function createRecordFromForm(roomId) {
            // 从当前房间的两个 tab 收集数据
            let waterUsage = null, waterPrice = null, waterCost = null;
            let elecUsage = null, elecPrice = null, elecCost = null;

            const waterUsageEl = document.getElementById(`${roomId}-water-input3`);
            const waterPriceEl = document.getElementById(`${roomId}-water-input4`);
            if (waterUsageEl && waterPriceEl) {
                const usage = parseFloat(waterUsageEl.value);
                const price = parseFloat(waterPriceEl.value);
                if (!isNaN(usage) && !isNaN(price)) {
                    waterUsage = usage;
                    waterPrice = price;
                    waterCost = usage * price;
                }
            }

            const elecUsageEl = document.getElementById(`${roomId}-elec-input3`);
            const elecPriceEl = document.getElementById(`${roomId}-elec-input4`);
            if (elecUsageEl && elecPriceEl) {
                const usage = parseFloat(elecUsageEl.value);
                const price = parseFloat(elecPriceEl.value);
                if (!isNaN(usage) && !isNaN(price)) {
                    elecUsage = usage;
                    elecPrice = price;
                    elecCost = usage * price;
                }
            }

            // 拿到记录日期（使用两个 tab 中较晚的日期）
            let recordDate = getToday();
            const waterDate2 = document.getElementById(`${roomId}-water-date2`);
            const elecDate2 = document.getElementById(`${roomId}-elec-date2`);
            if (elecDate2 && elecDate2.value) recordDate = elecDate2.value;
            if (waterDate2 && waterDate2.value) recordDate = waterDate2.value;

            // 收集抄表起止日期：取两个 tab 中最早的 date1 作为开始，最晚的 date2 作为结束
            const waterDate1 = document.getElementById(`${roomId}-water-date1`);
            const elecDate1 = document.getElementById(`${roomId}-elec-date1`);
            const startCandidates = [
                waterDate1 && waterDate1.value ? waterDate1.value : null,
                elecDate1 && elecDate1.value ? elecDate1.value : null
            ].filter(Boolean);
            const endCandidates = [
                waterDate2 && waterDate2.value ? waterDate2.value : null,
                elecDate2 && elecDate2.value ? elecDate2.value : null
            ].filter(Boolean);
            const meterDateStart = startCandidates.length ? startCandidates.sort()[0] : null;
            const meterDateEnd = endCandidates.length ? endCandidates.sort().reverse()[0] : null;

            return {
                id: generateRecordId(),
                date: recordDate,
                meterDateStart: meterDateStart,
                meterDateEnd: meterDateEnd,
                waterUsage: waterUsage,
                waterUnitPrice: waterPrice,
                waterCost: waterCost,
                elecUsage: elecUsage,
                elecUnitPrice: elecPrice,
                elecCost: elecCost,
                remark: '',
                savedAt: new Date().toISOString(),
                roomId: roomId
            };
        }

        function addRecordToStorage(roomId, record) {
            const records = loadRecords(roomId);
            records.unshift(record); // 插入到最前面（倒序）
            saveRecords(roomId, records);
            currentRecordsPage = 1;
            renderRecords(roomId);
        }

        // ==================== 弹窗管理 ====================
        function openRecordModal(roomId, recordId) {
            const overlay = document.getElementById('record-modal-overlay');
            const title = document.getElementById('record-modal-title');
            document.getElementById('record-id').value = recordId || '';
            document.getElementById('record-date').value = getToday();
            document.getElementById('record-water-usage').value = '';
            document.getElementById('record-water-price').value = '2.8';
            document.getElementById('record-elec-usage').value = '';
            document.getElementById('record-elec-price').value = '0.55';
            document.getElementById('record-remark').value = '';
            document.getElementById('record-meter-start').value = '';
            document.getElementById('record-meter-end').value = '';
            document.getElementById('record-water-cost').textContent = '¥ 0';
            document.getElementById('record-elec-cost').textContent = '¥ 0';
            document.getElementById('record-total-cost').textContent = '¥ 0';

            if (recordId) {
                // 编辑模式：填充已有数据
                title.textContent = '编辑记录';
                const records = loadRecords(roomId);
                const record = records.find(r => r.id === recordId);
                if (record) {
                    document.getElementById('record-date').value = record.date || getToday();
                    document.getElementById('record-meter-start').value = record.meterDateStart || '';
                    document.getElementById('record-meter-end').value = record.meterDateEnd || '';
                    document.getElementById('record-water-usage').value = record.waterUsage || '';
                    document.getElementById('record-water-price').value = record.waterUnitPrice != null ? record.waterUnitPrice : '2.8';
                    document.getElementById('record-elec-usage').value = record.elecUsage || '';
                    document.getElementById('record-elec-price').value = record.elecUnitPrice != null ? record.elecUnitPrice : '0.55';
                    document.getElementById('record-remark').value = record.remark || '';
                    updateRecordModalCalc();
                }
            } else {
                title.textContent = '新增记录';
            }

            // 存储当前操作的房间 ID
            overlay.dataset.roomId = roomId;
            overlay.classList.add('open');
        }

        function closeRecordModal() {
            document.getElementById('record-modal-overlay').classList.remove('open');
        }

        function updateRecordModalCalc() {
            const wUsage = parseFloat(document.getElementById('record-water-usage').value) || 0;
            const wPrice = parseFloat(document.getElementById('record-water-price').value) || 0;
            const eUsage = parseFloat(document.getElementById('record-elec-usage').value) || 0;
            const ePrice = parseFloat(document.getElementById('record-elec-price').value) || 0;

            const wCost = wUsage * wPrice;
            const eCost = eUsage * ePrice;
            const total = wCost + eCost;

            document.getElementById('record-water-cost').textContent = formatMoney(wCost);
            document.getElementById('record-elec-cost').textContent = formatMoney(eCost);
            document.getElementById('record-total-cost').textContent = formatMoney(total);
        }

        function saveRecordFromModal() {
            const overlay = document.getElementById('record-modal-overlay');
            const roomId = overlay.dataset.roomId;
            if (!roomId) return;

            const recordId = document.getElementById('record-id').value;
            const date = document.getElementById('record-date').value || getToday();
            const meterDateStart = document.getElementById('record-meter-start').value || null;
            const meterDateEnd = document.getElementById('record-meter-end').value || null;
            const wUsage = parseFloat(document.getElementById('record-water-usage').value) || null;
            const wPrice = parseFloat(document.getElementById('record-water-price').value) || null;
            const eUsage = parseFloat(document.getElementById('record-elec-usage').value) || null;
            const ePrice = parseFloat(document.getElementById('record-elec-price').value) || null;
            const remark = document.getElementById('record-remark').value.trim();

            const record = {
                id: recordId || generateRecordId(),
                date: date,
                meterDateStart: meterDateStart,
                meterDateEnd: meterDateEnd,
                waterUsage: wUsage,
                waterUnitPrice: wPrice,
                waterCost: wUsage != null && wPrice != null ? wUsage * wPrice : null,
                elecUsage: eUsage,
                elecUnitPrice: ePrice,
                elecCost: eUsage != null && ePrice != null ? eUsage * ePrice : null,
                remark: remark,
                savedAt: new Date().toISOString(),
                roomId: roomId
            };

            const records = loadRecords(roomId);

            if (recordId) {
                // 编辑模式
                const idx = records.findIndex(r => r.id === recordId);
                if (idx !== -1) {
                    record.savedAt = records[idx].savedAt; // 保留原始保存时间
                    records[idx] = record;
                }
            } else {
                // 新增
                records.unshift(record);
            }

            saveRecords(roomId, records);
            currentRecordsPage = 1;
            closeRecordModal();
            renderRecords(roomId);

            // 滚动到记录列表
            const section = document.querySelector('.records-section');
            if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ==================== 删除确认 ====================
        function showDeleteConfirm(roomId, recordId) {
            pendingDeleteRoomId = roomId;
            pendingDeleteRecordId = recordId;
            document.getElementById('confirm-overlay').classList.add('open');
        }

        function closeConfirmDialog() {
            document.getElementById('confirm-overlay').classList.remove('open');
            pendingDeleteRecordId = null;
            pendingDeleteRoomId = null;
        }

        function confirmDeleteRecord() {
            if (!pendingDeleteRecordId || !pendingDeleteRoomId) return;

            // 先保存 roomId，因为 closeConfirmDialog() 会将其置为 null
            const roomId = pendingDeleteRoomId;
            const recordId = pendingDeleteRecordId;

            const records = loadRecords(roomId);
            const updated = records.filter(r => r.id !== recordId);
            saveRecords(roomId, updated);

            // 如果当前页没有记录了，回退一页
            const { totalPages } = getRecordsFromPage(roomId, currentRecordsPage);
            if (currentRecordsPage > totalPages) {
                currentRecordsPage = Math.max(1, totalPages);
            }

            closeConfirmDialog();
            renderRecords(roomId);
        }

            updateDeleteButtonStates();
        }

        function renderMainArea() {
            const mainEl = document.getElementById('main-area');
            if (!selectedRoomId || !roomList.includes(selectedRoomId)) {
                selectedRoomId = roomList[0];
            }
            currentRecordsPage = 1;
            mainEl.innerHTML = createRoomPanel(selectedRoomId) +
                '<div class="records-section" id="records-container"></div>';

        }

            renderSidebar();
            renderMainArea();

        // ==================== 房间选择 ====================
        function selectRoom(roomId) {
            if (roomId === selectedRoomId) return;
            selectedRoomId = roomId;
            saveSelectedRoom();
            currentRecordsPage = 1;

            document.querySelectorAll('.room-list-item').forEach(item => {
                item.classList.toggle('active', item.dataset.room === roomId);
            });

            renderMainArea();

            let restored = false;
            TABS.forEach(tab => {
                const prefix = `${roomId}-${tab}`;
                if (localStorage.getItem(getStorageKey(prefix))) restored = true;
            });
            if (restored) showRestoreToast();
        }

        // ==================== 房间管理 ====================
        function addRoom() {
            roomCounter++;
            const roomId = `r${roomCounter}`;
            roomList.push(roomId);
            saveRoomList();

            selectedRoomId = roomId;
            saveSelectedRoom();
            renderAll();

            const newItem = document.querySelector(`.room-list-item[data-room="${roomId}"]`);
            if (newItem) newItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function deleteRoom(event, roomId) {
            event.stopPropagation();
            if (roomList.length <= 1) return;

            const roomName = getRoomName(roomId);
            if (!confirm(`确定要删除「${roomName}」吗？该房间的所有数据将被清除。`)) return;

            TABS.forEach(tab => {
                localStorage.removeItem(getStorageKey(`${roomId}-${tab}`));
            });
            localStorage.removeItem(getRoomNameKey(roomId));
            localStorage.removeItem(getRecordsKey(roomId));

            roomList = roomList.filter(id => id !== roomId);
            saveRoomList();

            if (selectedRoomId === roomId) {
                selectedRoomId = roomList[0];
                saveSelectedRoom();
            }

            renderAll();
        }

        function updateDeleteButtonStates() {
            const disabled = roomList.length <= 1;
            document.querySelectorAll('.room-list-delete').forEach(btn => {
                btn.disabled = disabled;
                btn.title = disabled ? '至少保留 1 个房间' : '删除房间';
            });
        }

        // ==================== Tab 切换 ====================
        function switchTab(roomId, tabName) {
            document.querySelectorAll(`.tab[data-room="${roomId}"]`).forEach(t => t.classList.remove('active'));
            document.querySelectorAll(`#${roomId} > .tab-content`).forEach(c => c.classList.remove('active'));
            const tabBtn = document.querySelector(`.tab[data-room="${roomId}"][data-tab="${tabName}"]`);
            const content = document.getElementById(`${roomId}-${tabName}`);
            if (tabBtn) tabBtn.classList.add('active');
            if (content) content.classList.add('active');
        }

        // ==================== 计算逻辑 ====================
        function updateCalc(prefix) {
            const input1 = document.getElementById(`${prefix}-input1`);
            const input2 = document.getElementById(`${prefix}-input2`);
            const input3 = document.getElementById(`${prefix}-input3`);
            const badge  = document.getElementById(`${prefix}-badge3`);

            if (!input1 || !input2 || !input3) return;

            const val1 = input1.value.trim();
            const val2 = input2.value.trim();

            if (val1 !== '' || val2 !== '') {
                input3.readOnly = true;
                badge.textContent = '自动计算';
                badge.classList.remove('manual');
                if (val1 !== '' && val2 !== '') {
                    const diff = parseFloat(val2) - parseFloat(val1);
                    input3.value = formatNumber(diff);
                } else {
                    input3.value = '';
                }
            } else {
                input3.readOnly = false;
                badge.textContent = '手动输入';
                badge.classList.add('manual');
            }
            updateResult(prefix);
        }

        function updateResult(prefix) {
            const input3 = document.getElementById(`${prefix}-input3`);
            const input4 = document.getElementById(`${prefix}-input4`);
            const result = document.getElementById(`${prefix}-result`);
            const formula = document.getElementById(`${prefix}-formula`);

            if (!input3 || !input4 || !result) return;

            const val3 = parseFloat(input3.value);
            const val4 = parseFloat(input4.value);

            if (isNaN(val3) || isNaN(val4)) {
                result.textContent = '¥ 0';
                result.classList.add('empty');
                formula.textContent = '';
                return;
            }

            const total = val3 * val4;
            result.textContent = `¥ ${formatNumber(total)}`;
            result.classList.remove('empty');
            formula.textContent = `${formatNumber(val3)} × ${formatNumber(val4)} = ${formatNumber(total)}`;
        }

        // ==================== localStorage 存储 ====================
        function saveToStorage(prefix) {
            try {
                const data = {
                    date1:  document.getElementById(`${prefix}-date1`).value,
                    date2:  document.getElementById(`${prefix}-date2`).value,
                    input1: document.getElementById(`${prefix}-input1`).value,
                    input2: document.getElementById(`${prefix}-input2`).value,
                    input3: document.getElementById(`${prefix}-input3`).value,
                    input4: document.getElementById(`${prefix}-input4`).value,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem(getStorageKey(prefix), JSON.stringify(data));
                showSaveIndicator(prefix);
            } catch (e) {
                console.error('保存数据失败:', e);
            }
        }

        function showSaveIndicator(prefix) {
            const indicator = document.getElementById(`${prefix}-save-indicator`);
            if (!indicator) return;
            indicator.classList.add('show');
            clearTimeout(indicator._timer);
            indicator._timer = setTimeout(() => indicator.classList.remove('show'), 2000);
        }

        function updateSaveTimeDisplay(prefix) {
            const timeEl = document.getElementById(`${prefix}-save-time`);
            const dotEl = document.getElementById(`${prefix}-save-dot`);
            if (!timeEl || !dotEl) return;
            try {
                const saved = localStorage.getItem(getStorageKey(prefix));
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.savedAt) {
                        timeEl.textContent = formatTimestamp(data.savedAt);
                        timeEl.classList.remove('never');
                        dotEl.classList.add('saved');
                        return;
                    }
                }
            } catch (e) {
                console.error('读取保存时间失败:', e);
            }
            timeEl.textContent = '尚未保存';
            timeEl.classList.add('never');
            dotEl.classList.remove('saved');
        }

        function manualSave(prefix) {
            // 保存当前 tab 数据到 localStorage
            saveToStorage(prefix);
            updateSaveTimeDisplay(prefix);

            // 提取 roomId 并自动生成记录
            const roomId = prefix.split('-').slice(0, -1).join('-');
            const record = createRecordFromForm(roomId);
            // 只在有水费或电费数据时才添加记录
            if (record.waterCost != null || record.elecCost != null) {
                addRecordToStorage(roomId, record);
            }
        }

        function showRestoreToast() {
            let toast = document.querySelector('.restore-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'restore-toast';
                toast.textContent = '✓ 已恢复上次保存的数据';
                document.body.appendChild(toast);
            }
            requestAnimationFrame(() => toast.classList.add('show'));
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function restoreFromStorage(prefix) {
            try {
                const saved = localStorage.getItem(getStorageKey(prefix));
                if (!saved) return false;
                const data = JSON.parse(saved);
                if (data.date1 !== undefined) document.getElementById(`${prefix}-date1`).value = data.date1;
                if (data.date2 !== undefined && data.date2) document.getElementById(`${prefix}-date2`).value = data.date2;
                if (data.input1 !== undefined) document.getElementById(`${prefix}-input1`).value = data.input1;
                if (data.input2 !== undefined) document.getElementById(`${prefix}-input2`).value = data.input2;
                if (data.input3 !== undefined) document.getElementById(`${prefix}-input3`).value = data.input3;
                if (data.input4 !== undefined) document.getElementById(`${prefix}-input4`).value = data.input4;
                updateCalc(prefix);
                return true;
            } catch (e) {
                console.error('恢复数据失败:', e);
                return false;
            }
        }

        // ==================== 房间名称编辑 ====================
        function loadRoomName(roomId) {
            const nameEl = document.getElementById(`${roomId}-name`);
            if (!nameEl) return;

            const saved = localStorage.getItem(getRoomNameKey(roomId));
            if (saved) nameEl.textContent = saved;

            nameEl.addEventListener('blur', () => {
                let name = nameEl.textContent.trim();
                if (!name) name = nameEl.dataset.default;
                nameEl.textContent = name;
                localStorage.setItem(getRoomNameKey(roomId), name);
                updateSidebarRoomName(roomId, name);
            });

            nameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nameEl.blur();
                }
            });

            nameEl.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                document.execCommand('insertText', false, text);
            });
        }

        function updateSidebarRoomName(roomId, name) {
            const item = document.querySelector(`.room-list-item[data-room="${roomId}"]`);
            if (item) {
                const nameEl = item.querySelector('.room-list-name');
                if (nameEl) nameEl.textContent = name;
                item.title = name;
            }
        }

        // ==================== 清除/重置 ====================
        function clearRoomData(roomId) {
            const roomName = getRoomName(roomId);
            if (!confirm(`确定要清除「${roomName}」的所有已保存数据吗？此操作不可撤销。`)) return;

            TABS.forEach(tab => {
                const prefix = `${roomId}-${tab}`;
                localStorage.removeItem(getStorageKey(prefix));
                resetForm(prefix);
                updateSaveTimeDisplay(prefix);
            });

            // 也清除记录
            localStorage.removeItem(getRecordsKey(roomId));
            currentRecordsPage = 1;
            renderRecords(roomId);
        }

        function resetForm(prefix) {
            const isElec = prefix.endsWith('-elec');
            const defaultPrice = isElec ? '0.55' : '2.8';

            document.getElementById(`${prefix}-date1`).value = '';
            document.getElementById(`${prefix}-date2`).value = getToday();
            document.getElementById(`${prefix}-input1`).value = '';
            document.getElementById(`${prefix}-input2`).value = '';
            document.getElementById(`${prefix}-input3`).value = '';
            document.getElementById(`${prefix}-input3`).readOnly = false;
            document.getElementById(`${prefix}-input4`).value = defaultPrice;

            const badge = document.getElementById(`${prefix}-badge3`);
            if (badge) {
                badge.textContent = '手动输入';
                badge.classList.add('manual');
            }

            localStorage.removeItem(getStorageKey(prefix));

            const timeEl = document.getElementById(`${prefix}-save-time`);
            const dotEl = document.getElementById(`${prefix}-save-dot`);
            if (timeEl) {
                timeEl.textContent = '尚未保存';
                timeEl.classList.add('never');
            }
            if (dotEl) dotEl.classList.remove('saved');

            updateResult(prefix);
        }

        // ==================== 房间列表持久化 ====================
        function loadRoomList() {
            try {
                const saved = localStorage.getItem(ROOM_LIST_KEY);
                if (saved) {
                    const list = JSON.parse(saved);
                    if (Array.isArray(list) && list.length > 0) {
                        roomList = list;
                        roomCounter = parseInt(localStorage.getItem(ROOM_COUNTER_KEY)) || 0;
                        roomList.forEach(id => {
                            const num = parseInt(id.replace('r', ''));
                            if (num > roomCounter) roomCounter = num;
                        });
                        return;
                    }
                }
            } catch (e) {
                console.error('加载房间列表失败:', e);
            }
            roomList = ['r1', 'r2'];
            roomCounter = 2;
            saveRoomList();
        }

        function saveRoomList() {
            localStorage.setItem(ROOM_LIST_KEY, JSON.stringify(roomList));
            localStorage.setItem(ROOM_COUNTER_KEY, String(roomCounter));
        }

        function loadSelectedRoom() {
            const saved = localStorage.getItem(SELECTED_ROOM_KEY);
            if (saved && roomList.includes(saved)) {
                selectedRoomId = saved;
            } else {
                selectedRoomId = roomList[0];
            }
        }

        function saveSelectedRoom() {
            localStorage.setItem(SELECTED_ROOM_KEY, selectedRoomId);
        }

        function loadSidebarState() {
            const collapsed = localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === 'true';
            const sidebar = document.getElementById('sidebar');
            const floatBtn = document.getElementById('btn-expand-floating');
            if (collapsed) {
                sidebar.classList.add('collapsed');
                floatBtn.classList.add('visible');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const floatBtn = document.getElementById('btn-expand-floating');
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem(SIDEBAR_COLLAPSED_KEY, isCollapsed);
            floatBtn.classList.toggle('visible', isCollapsed);
        }

        // ==================== 初始化单个房间面板 ====================
        function initRoomPanel(roomId) {
            loadRoomName(roomId);

            const today = getToday();
            let restored = false;

            TABS.forEach(tab => {
                const prefix = `${roomId}-${tab}`;

                document.getElementById(`${prefix}-date2`).value = today;

                document.getElementById(`${prefix}-input1`).addEventListener('input', () => updateCalc(prefix));
                document.getElementById(`${prefix}-input2`).addEventListener('input', () => updateCalc(prefix));
                document.getElementById(`${prefix}-input3`).addEventListener('input', () => updateResult(prefix));
                document.getElementById(`${prefix}-input4`).addEventListener('input', () => updateResult(prefix));

                if (restoreFromStorage(prefix)) restored = true;

                updateSaveTimeDisplay(prefix);
                updateResult(prefix);
            });

            // 渲染记录列表
            renderRecords(roomId);

            return restored;
        }

        // ==================== 初始化 ====================
        function init() {
            loadRoomList();
            loadSelectedRoom();
            loadSidebarState();
            renderAll();

            let anyRestored = false;
            TABS.forEach(tab => {
                const prefix = `${selectedRoomId}-${tab}`;
                if (localStorage.getItem(getStorageKey(prefix))) anyRestored = true;
            });
            if (anyRestored) showRestoreToast();
        }

        init();
    </script>
</body>
</html>
