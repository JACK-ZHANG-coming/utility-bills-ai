<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水电费快捷计算</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 16px;
            color: #1a1a1a;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        /* GitHub 图标 */
        .github-link {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #f5f5f5;
            transition: all 0.25s ease;
            z-index: 10;
            text-decoration: none;
        }
        .github-link:hover { background: #24292f; }
        .github-link svg { width: 20px; height: 20px; fill: #555; transition: fill 0.25s ease; }
        .github-link:hover svg { fill: #ffffff; }

        /* Header */
        .header {
            padding: 28px 32px 16px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header .subtitle {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
        }

        /* ==================== Layout: Sidebar + Main ==================== */
        .body-layout {
            display: flex;
            min-height: 520px;
            position: relative;
        }

        /* ==================== Sidebar ==================== */
        .sidebar {
            flex-shrink: 0;
            width: 220px;
            background: #f8fafc;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            transition: width 0.28s ease;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 0;
            border-right: none;
        }
        /* 收起时隐藏侧边栏所有内部内容 */
        .sidebar.collapsed .sidebar-header,
        .sidebar.collapsed .room-list,
        .sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* 收起时显示的悬浮展开按钮 */
        .btn-expand-floating {
            position: absolute;
            top: 14px;
            left: 14px;
            padding: 10px 12px 8px;
            border: none;
            border-radius: 12px;
            background: #6366f1;
            color: #ffffff;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-16px) scale(0.92);
            white-space: nowrap;
        }
        .btn-expand-floating.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0) scale(1);
            animation: floatPulse 2.4s ease-in-out 0.6s infinite;
        }
        .btn-expand-floating:hover {
            background: #4f46e5;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: scale(1.05);
            animation: none;
        }
        .btn-expand-floating svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }
        @keyframes floatPulse {
            0%, 100% { box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 3px 12px rgba(99, 102, 241, 0.4), 0 0 0 6px rgba(99, 102, 241, 0.12); }
        }

        .sidebar-header {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e2e8f0;
            min-height: 50px;
        }
        .sidebar-title {
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .btn-toggle-sidebar {
            width: 32px;
            height: 32px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #f1f5f9;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .btn-toggle-sidebar:hover {
            background: #6366f1;
            border-color: #6366f1;
            color: #ffffff;
        }
        .btn-toggle-sidebar svg {
            width: 18px;
            height: 18px;
        }

        /* Room List in Sidebar */
        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .room-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
            position: relative;
        }
        .room-list-item:hover {
            background: #f1f5f9;
        }
        .room-list-item.active {
            background: #eef2ff;
            border-color: #c7d2fe;
        }

        .room-list-item .room-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
            background: var(--badge-color, #6366f1);
        }

        .room-list-item .room-list-name {
            font-size: 14px;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            transition: opacity 0.2s ease;
        }
        .room-list-item.active .room-list-name {
            color: #4338ca;
            font-weight: 600;
        }

        .room-list-item .room-list-delete {
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 5px;
            background: transparent;
            color: #cbd5e1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .room-list-item:hover .room-list-delete { opacity: 1; }
        .room-list-item .room-list-delete:hover {
            background: #fee2e2;
            color: #dc2626;
        }
        .room-list-item .room-list-delete:disabled {
            opacity: 0;
            pointer-events: none;
        }
        .room-list-item .room-list-delete svg {
            width: 13px;
            height: 13px;
        }

        /* Add Room button in sidebar */
        .sidebar-footer {
            padding: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .btn-add-room {
            width: 100%;
            padding: 10px 12px;
            border: 2px dashed #c7d2fe;
            border-radius: 10px;
            background: #f5f3ff;
            color: #6366f1;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-add-room:hover {
            border-color: #6366f1;
            background: #ede9fe;
        }
        .sidebar.collapsed .btn-add-room {
            padding: 10px;
        }

        /* ==================== Main Area ==================== */
        .main-area {
            flex: 1;
            padding: 24px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .main-area .room-panel {
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        /* Room Header */
        .room-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            background: var(--header-bg, #f5f5f5);
        }

        .room-header .room-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
            background: var(--badge-color, #6366f1);
        }

        .room-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            outline: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s, background 0.2s;
            min-width: 50px;
            padding: 2px 6px;
            border-radius: 4px;
            cursor: text;
        }
        .room-name:hover {
            background: rgba(99, 102, 241, 0.08);
        }
        .room-name:focus {
            border-bottom-color: #6366f1;
            background: rgba(255, 255, 255, 0.6);
        }
        .edit-icon {
            color: #9ca3af;
            flex-shrink: 0;
        }

        .room-actions {
            margin-left: auto;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .btn-clear-room {
            padding: 5px 12px;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            background: #fef2f2;
            color: #dc2626;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            white-space: nowrap;
        }
        .btn-clear-room:hover {
            background: #fee2e2;
            border-color: #f87171;
            color: #b91c1c;
        }

        /* ==================== Tabs ==================== */
        .tabs {
            display: flex;
            padding: 12px 20px 0;
            gap: 6px;
        }
        .tab {
            flex: 1;
            padding: 10px 12px;
            border: none;
            background: #f5f5f5;
            border-radius: 10px 10px 0 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .tab:hover { background: #efefef; }
        .tab.active {
            background: #ffffff;
            font-weight: 600;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
        }
        .tab.active[data-tab="elec"] { color: #d97706; }
        .tab.active[data-tab="water"] { color: #0891b2; }
        .tab-icon { font-size: 16px; }

        /* Tab Content */
        .tab-content {
            display: none;
            padding: 20px 20px 24px;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== Form Rows ==================== */
        .form-row { margin-bottom: 16px; }
        .form-row.with-date {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .date-group { flex-shrink: 0; width: 140px; }
        .reading-group { flex: 1; min-width: 0; }

        /* 侧边栏展开时：日期和度数各自撑满整行（垂直堆叠） */
        .sidebar:not(.collapsed) ~ .main-area .form-row.with-date {
            flex-direction: column;
            gap: 12px;
            align-items: stretch;
        }
        .sidebar:not(.collapsed) ~ .main-area .date-group,
        .sidebar:not(.collapsed) ~ .main-area .reading-group {
            width: 100%;
        }

        .field-label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 15px;
            color: #1a1a1a;
            background: #ffffff;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .field-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }
        .field-input:read-only {
            background: #f8f8f8;
            color: #888;
            cursor: not-allowed;
        }
        .field-input:read-only:focus {
            border-color: #e5e5e5;
            box-shadow: none;
        }

        .date-input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 14px;
            color: #1a1a1a;
            background: #ffffff;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .date-input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .unit {
            position: absolute;
            right: 14px;
            font-size: 14px;
            color: #aaa;
            pointer-events: none;
            white-space: nowrap;
        }
        .input-wrap.has-unit .field-input { padding-right: 56px; }

        .auto-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #e0f2fe;
            color: #0284c7;
            margin-left: 6px;
            font-weight: 500;
            vertical-align: middle;
        }
        .auto-badge.manual {
            background: #fef3c7;
            color: #b45309;
        }

        /* ==================== Result Card ==================== */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .tab-content[data-type="elec"] .result-card {
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            border: 1px solid #fed7aa;
        }
        .tab-content[data-type="water"] .result-card {
            background: linear-gradient(135deg, #ecfeff 0%, #cffafe 100%);
            border: 1px solid #a5f3fc;
        }

        .result-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .result-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            transition: color 0.2s ease;
        }
        .tab-content[data-type="elec"] .result-value { color: #c2410c; }
        .tab-content[data-type="water"] .result-value { color: #0e7490; }
        .result-value.empty { color: #ccc; }
        .result-formula {
            font-size: 13px;
            color: #999;
            margin-top: 8px;
            min-height: 18px;
        }

        /* ==================== Save Status Bar ==================== */
        .save-status-bar {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 12px;
        }
        .save-status-bar .save-label {
            color: #64748b;
            font-weight: 500;
            white-space: nowrap;
        }
        .save-status-bar .save-time {
            color: #1e293b;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .save-status-bar .save-time.never {
            color: #94a3b8;
            font-weight: 400;
        }
        .save-status-bar .save-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #cbd5e1;
            flex-shrink: 0;
            transition: background 0.3s ease;
        }
        .save-status-bar .save-dot.saved { background: #22c55e; }

        /* ==================== Actions ==================== */
        .actions {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .actions-btns {
            display: flex;
            gap: 8px;
        }
        .btn-reset {
            padding: 7px 16px;
            border: 1.5px solid #e5e5e5;
            border-radius: 8px;
            background: #ffffff;
            color: #666;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .btn-reset:hover {
            border-color: #ccc;
            color: #333;
            background: #f8f8f8;
        }
        .btn-save {
            padding: 7px 16px;
            border: 1.5px solid #3b82f6;
            border-radius: 8px;
            background: #3b82f6;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            font-weight: 500;
        }
        .btn-save:hover {
            background: #2563eb;
            border-color: #2563eb;
        }
        .btn-save:active { transform: scale(0.96); }

        .save-indicator {
            font-size: 12px;
            color: #16a34a;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .save-indicator.show { opacity: 1; }

        .restore-toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(26, 26, 26, 0.92);
            color: #fff;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }
        .restore-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Hide number spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }

        /* ==================== Responsive ==================== */
        @media (max-width: 640px) {
            body { padding: 16px 8px; }
            .header { padding: 24px 16px 12px; }
            .sidebar { width: 180px; }
            .main-area { padding: 16px; }
            .tab-content { padding: 16px 16px 20px; }
            .tabs { padding: 10px 16px 0; }
            .result-value { font-size: 28px; }
            .actions { flex-direction: column; align-items: stretch; }
            .actions-btns { justify-content: flex-end; }
            .room-header { padding: 12px 16px; }
        }

        /* Mobile: sidebar becomes overlay */
        @media (max-width: 480px) {
            .sidebar {
                position: absolute;
                z-index: 100;
                height: 100%;
                box-shadow: 4px 0 16px rgba(0,0,0,0.1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- GitHub 链接 -->
        <a href="https://github.com/JACK-ZHANG-coming/utility-bills-ai" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub 项目">
            <svg viewBox="0 0 24 24">
                <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
        </a>

        <div class="header">
            <h1>水电费快捷计算</h1>
            <div class="subtitle">输入抄表数据，自动计算费用</div>
        </div>

        <div class="body-layout">
            <!-- 收起时显示的悬浮展开按钮 -->
            <button class="btn-expand-floating" id="btn-expand-floating" onclick="toggleSidebar()" title="展开侧边栏">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
                <span>展开</span>
            </button>
            <!-- 侧边栏：房间列表 -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <span class="sidebar-title">房间列表</span>
                    <button class="btn-toggle-sidebar" onclick="toggleSidebar()" title="收起/展开侧边栏">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </button>
                </div>
                <div class="room-list" id="room-list">
                    <!-- 房间列表项由 JS 动态生成 -->
                </div>
                <div class="sidebar-footer">
                    <button class="btn-add-room" onclick="addRoom()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span>新增房间</span>
                    </button>
                </div>
            </aside>

            <!-- 主区域：单房间展示 -->
            <main class="main-area" id="main-area">
                <!-- 当前选中房间的面板由 JS 动态渲染 -->
            </main>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const TABS = ['elec', 'water'];
        const TAB_CONFIG = {
            elec:  { icon: '⚡', label: '电费', meterLabel: '电表', unit: '度', priceUnit: '元/度', resultLabel: '应缴电费', usageLabel: '用电量', defaultPrice: '0.55' },
            water: { icon: '💧', label: '水费', meterLabel: '水表', unit: '吨', priceUnit: '元/吨', resultLabel: '应缴水费', usageLabel: '用水量', defaultPrice: '2.8' }
        };

        // 房间头部颜色调色板（循环使用）
        const ROOM_COLORS = [
            { headerBg: 'linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%)', badgeBg: '#6366f1' },
            { headerBg: 'linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%)', badgeBg: '#8b5cf6' },
            { headerBg: 'linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%)', badgeBg: '#10b981' },
            { headerBg: 'linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%)', badgeBg: '#f59e0b' },
            { headerBg: 'linear-gradient(135deg, #ecfeff 0%, #cffafe 100%)', badgeBg: '#06b6d4' },
            { headerBg: 'linear-gradient(135deg, #fdf4ff 0%, #fae8ff 100%)', badgeBg: '#d946ef' },
            { headerBg: 'linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%)', badgeBg: '#ef4444' },
            { headerBg: 'linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%)', badgeBg: '#22c55e' },
        ];

        // 持久化键
        const ROOM_LIST_KEY = 'utility-bills-room-list';
        const ROOM_COUNTER_KEY = 'utility-bills-room-counter';
        const SELECTED_ROOM_KEY = 'utility-bills-selected-room';
        const SIDEBAR_COLLAPSED_KEY = 'utility-bills-sidebar-collapsed';

        // 动态房间状态
        let roomList = [];
        let roomCounter = 0;
        let selectedRoomId = null;

        // ==================== 存储键辅助函数 ====================
        function getStorageKey(prefix) {
            return `utility-bills-${prefix}`;
        }
        function getRoomNameKey(roomId) {
            return `utility-bills-${roomId}-name`;
        }

        // ==================== 工具函数 ====================
        function getToday() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatNumber(num) {
            if (num === 0) return '0';
            return parseFloat(num.toPrecision(12)).toString();
        }

        function formatTimestamp(isoString) {
            const d = new Date(isoString);
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const h = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            const s = String(d.getSeconds()).padStart(2, '0');
            return `${y}-${m}-${day} ${h}:${min}:${s}`;
        }

        function getRoomName(roomId) {
            const saved = localStorage.getItem(getRoomNameKey(roomId));
            if (saved) return saved;
            const idx = roomList.indexOf(roomId);
            return `房间${idx >= 0 ? idx + 1 : '?'}`;
        }

        function getRoomIndex(roomId) {
            return roomList.indexOf(roomId);
        }

        function getRoomColor(roomId) {
            const idx = getRoomIndex(roomId);
            return ROOM_COLORS[idx % ROOM_COLORS.length];
        }

        // ==================== 房间列表持久化 ====================
        function loadRoomList() {
            try {
                const saved = localStorage.getItem(ROOM_LIST_KEY);
                if (saved) {
                    const list = JSON.parse(saved);
                    if (Array.isArray(list) && list.length > 0) {
                        roomList = list;
                        roomCounter = parseInt(localStorage.getItem(ROOM_COUNTER_KEY)) || 0;
                        roomList.forEach(id => {
                            const num = parseInt(id.replace('r', ''));
                            if (num > roomCounter) roomCounter = num;
                        });
                        return;
                    }
                }
            } catch (e) {
                console.error('加载房间列表失败:', e);
            }
            roomList = ['r1', 'r2'];
            roomCounter = 2;
            saveRoomList();
        }

        function saveRoomList() {
            localStorage.setItem(ROOM_LIST_KEY, JSON.stringify(roomList));
            localStorage.setItem(ROOM_COUNTER_KEY, String(roomCounter));
        }

        // ==================== 选中房间持久化 ====================
        function loadSelectedRoom() {
            const saved = localStorage.getItem(SELECTED_ROOM_KEY);
            if (saved && roomList.includes(saved)) {
                selectedRoomId = saved;
            } else {
                selectedRoomId = roomList[0];
            }
        }

        function saveSelectedRoom() {
            localStorage.setItem(SELECTED_ROOM_KEY, selectedRoomId);
        }

        // ==================== 侧边栏折叠状态 ====================
        function loadSidebarState() {
            const collapsed = localStorage.getItem(SIDEBAR_COLLAPSED_KEY) === 'true';
            const sidebar = document.getElementById('sidebar');
            const floatBtn = document.getElementById('btn-expand-floating');
            if (collapsed) {
                sidebar.classList.add('collapsed');
                floatBtn.classList.add('visible');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const floatBtn = document.getElementById('btn-expand-floating');
            sidebar.classList.toggle('collapsed');
            const isCollapsed = sidebar.classList.contains('collapsed');
            localStorage.setItem(SIDEBAR_COLLAPSED_KEY, isCollapsed);
            floatBtn.classList.toggle('visible', isCollapsed);
        }

        // ==================== HTML 生成 ====================
        // 生成单个 Tab 内容（电费或水费）
        function createTabContent(prefix, tab) {
            const cfg = TAB_CONFIG[tab];
            return `
            <div class="form-row with-date">
                <div class="date-group">
                    <label class="field-label">抄表日期</label>
                    <input type="date" class="date-input" id="${prefix}-date1">
                </div>
                <div class="reading-group">
                    <label class="field-label">上期${cfg.meterLabel}度数</label>
                    <div class="input-wrap has-unit">
                        <input type="number" step="any" class="field-input" id="${prefix}-input1" placeholder="0">
                        <span class="unit">${cfg.unit}</span>
                    </div>
                </div>
            </div>
            <div class="form-row with-date">
                <div class="date-group">
                    <label class="field-label">抄表日期</label>
                    <input type="date" class="date-input" id="${prefix}-date2">
                </div>
                <div class="reading-group">
                    <label class="field-label">本期${cfg.meterLabel}度数</label>
                    <div class="input-wrap has-unit">
                        <input type="number" step="any" class="field-input" id="${prefix}-input2" placeholder="0">
                        <span class="unit">${cfg.unit}</span>
                    </div>
                </div>
            </div>
            <div class="form-row">
                <label class="field-label">
                    ${cfg.usageLabel}
                    <span class="auto-badge manual" id="${prefix}-badge3">手动输入</span>
                </label>
                <div class="input-wrap has-unit">
                    <input type="number" step="any" class="field-input" id="${prefix}-input3" placeholder="0">
                    <span class="unit">${cfg.unit}</span>
                </div>
            </div>
            <div class="form-row">
                <label class="field-label">单价</label>
                <div class="input-wrap has-unit">
                    <input type="number" step="any" class="field-input" id="${prefix}-input4" value="${cfg.defaultPrice}">
                    <span class="unit">${cfg.priceUnit}</span>
                </div>
            </div>
            <div class="result-card">
                <div class="result-label">${cfg.resultLabel}</div>
                <div class="result-value empty" id="${prefix}-result">¥ 0</div>
                <div class="result-formula" id="${prefix}-formula"></div>
            </div>
            <div class="save-status-bar" id="${prefix}-save-status">
                <div style="display:flex;align-items:center;gap:8px;">
                    <span class="save-dot" id="${prefix}-save-dot"></span>
                    <span class="save-label">上次保存时间</span>
                </div>
                <span class="save-time never" id="${prefix}-save-time">尚未保存</span>
            </div>
            <div class="actions">
                <span class="save-indicator" id="${prefix}-save-indicator">✓ 已保存</span>
                <div class="actions-btns">
                    <button class="btn-save" onclick="manualSave('${prefix}')">保存数据</button>
                    <button class="btn-reset" onclick="resetForm('${prefix}')">重置</button>
                </div>
            </div>`;
        }

        // 生成整个房间面板（主区域用）
        function createRoomPanel(roomId) {
            const idx = getRoomIndex(roomId);
            const defaultName = `房间${idx + 1}`;
            const badge = String(idx + 1);
            const color = getRoomColor(roomId);

            let tabsHTML = '';
            let contentsHTML = '';
            TABS.forEach((tab, tabIdx) => {
                const cfg = TAB_CONFIG[tab];
                const prefix = `${roomId}-${tab}`;
                tabsHTML += `
                <button class="tab ${tabIdx === 0 ? 'active' : ''}" data-room="${roomId}" data-tab="${tab}" onclick="switchTab('${roomId}', '${tab}')">
                    <span class="tab-icon">${cfg.icon}</span>
                    <span>${cfg.label}</span>
                </button>`;
                contentsHTML += `
                <div class="tab-content ${tabIdx === 0 ? 'active' : ''}" data-type="${tab}" id="${prefix}">
                    ${createTabContent(prefix, tab)}
                </div>`;
            });

            return `
            <div class="room-panel" data-room="${roomId}" id="${roomId}"
                 style="--badge-color: ${color.badgeBg}; --header-bg: ${color.headerBg};">
                <div class="room-header">
                    <div class="room-badge">${badge}</div>
                    <span class="room-name" contenteditable="true" id="${roomId}-name" data-default="${defaultName}" spellcheck="false">${defaultName}</span>
                    <svg class="edit-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    <div class="room-actions">
                        <button class="btn-clear-room" onclick="clearRoomData('${roomId}')">清除</button>
                    </div>
                </div>
                <div class="tabs">${tabsHTML}</div>
                ${contentsHTML}
            </div>`;
        }

        // 生成侧边栏房间列表项
        function createRoomListItem(roomId) {
            const idx = getRoomIndex(roomId);
            const name = getRoomName(roomId);
            const badge = String(idx + 1);
            const color = getRoomColor(roomId);
            const isActive = roomId === selectedRoomId;

            return `
            <div class="room-list-item ${isActive ? 'active' : ''}" data-room="${roomId}" onclick="selectRoom('${roomId}')" title="${name}">
                <div class="room-badge" style="background: ${color.badgeBg};">${badge}</div>
                <span class="room-list-name">${name}</span>
                <button class="room-list-delete" onclick="deleteRoom(event, '${roomId}')" title="删除房间">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>`;
        }

        // ==================== 渲染 ====================
        function renderSidebar() {
            const listEl = document.getElementById('room-list');
            listEl.innerHTML = roomList.map(id => createRoomListItem(id)).join('');
            updateDeleteButtonStates();
        }

        function renderMainArea() {
            const mainEl = document.getElementById('main-area');
            if (!selectedRoomId || !roomList.includes(selectedRoomId)) {
                selectedRoomId = roomList[0];
            }
            mainEl.innerHTML = createRoomPanel(selectedRoomId);
            initRoomPanel(selectedRoomId);
        }

        function renderAll() {
            renderSidebar();
            renderMainArea();
        }

        // ==================== 房间选择 ====================
        function selectRoom(roomId) {
            if (roomId === selectedRoomId) return;
            selectedRoomId = roomId;
            saveSelectedRoom();

            // 更新侧边栏高亮
            document.querySelectorAll('.room-list-item').forEach(item => {
                item.classList.toggle('active', item.dataset.room === roomId);
            });

            // 重新渲染主区域（干净切换，无残留）
            renderMainArea();

            // 恢复数据提示
            let restored = false;
            TABS.forEach(tab => {
                const prefix = `${roomId}-${tab}`;
                if (localStorage.getItem(getStorageKey(prefix))) restored = true;
            });
            if (restored) showRestoreToast();
        }

        // ==================== 房间管理 ====================
        function addRoom() {
            roomCounter++;
            const roomId = `r${roomCounter}`;
            roomList.push(roomId);
            saveRoomList();

            // 选中新增房间
            selectedRoomId = roomId;
            saveSelectedRoom();

            // 重新渲染
            renderAll();

            // 滚动侧边栏到新房间
            const newItem = document.querySelector(`.room-list-item[data-room="${roomId}"]`);
            if (newItem) newItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function deleteRoom(event, roomId) {
            event.stopPropagation();
            if (roomList.length <= 1) return;

            const roomName = getRoomName(roomId);
            if (!confirm(`确定要删除「${roomName}」吗？该房间的所有数据将被清除。`)) return;

            // 清除该房间的所有 localStorage 数据
            TABS.forEach(tab => {
                localStorage.removeItem(getStorageKey(`${roomId}-${tab}`));
            });
            localStorage.removeItem(getRoomNameKey(roomId));

            // 从房间列表移除
            roomList = roomList.filter(id => id !== roomId);
            saveRoomList();

            // 如果删除的是当前选中的房间，切换到第一个
            if (selectedRoomId === roomId) {
                selectedRoomId = roomList[0];
                saveSelectedRoom();
            }

            // 重新渲染
            renderAll();
        }

        // 更新删除按钮的禁用状态
        function updateDeleteButtonStates() {
            const disabled = roomList.length <= 1;
            document.querySelectorAll('.room-list-delete').forEach(btn => {
                btn.disabled = disabled;
                btn.title = disabled ? '至少保留 1 个房间' : '删除房间';
            });
        }

        // ==================== Tab 切换 ====================
        function switchTab(roomId, tabName) {
            document.querySelectorAll(`.tab[data-room="${roomId}"]`).forEach(t => t.classList.remove('active'));
            document.querySelectorAll(`#${roomId} > .tab-content`).forEach(c => c.classList.remove('active'));
            const tabBtn = document.querySelector(`.tab[data-room="${roomId}"][data-tab="${tabName}"]`);
            const content = document.getElementById(`${roomId}-${tabName}`);
            if (tabBtn) tabBtn.classList.add('active');
            if (content) content.classList.add('active');
        }

        // ==================== 计算逻辑 ====================
        function updateCalc(prefix) {
            const input1 = document.getElementById(`${prefix}-input1`);
            const input2 = document.getElementById(`${prefix}-input2`);
            const input3 = document.getElementById(`${prefix}-input3`);
            const badge  = document.getElementById(`${prefix}-badge3`);

            if (!input1 || !input2 || !input3) return;

            const val1 = input1.value.trim();
            const val2 = input2.value.trim();

            if (val1 !== '' || val2 !== '') {
                input3.readOnly = true;
                badge.textContent = '自动计算';
                badge.classList.remove('manual');
                if (val1 !== '' && val2 !== '') {
                    const diff = parseFloat(val2) - parseFloat(val1);
                    input3.value = formatNumber(diff);
                } else {
                    input3.value = '';
                }
            } else {
                input3.readOnly = false;
                badge.textContent = '手动输入';
                badge.classList.add('manual');
            }
            updateResult(prefix);
        }

        function updateResult(prefix) {
            const input3 = document.getElementById(`${prefix}-input3`);
            const input4 = document.getElementById(`${prefix}-input4`);
            const result = document.getElementById(`${prefix}-result`);
            const formula = document.getElementById(`${prefix}-formula`);

            if (!input3 || !input4 || !result) return;

            const val3 = parseFloat(input3.value);
            const val4 = parseFloat(input4.value);

            if (isNaN(val3) || isNaN(val4)) {
                result.textContent = '¥ 0';
                result.classList.add('empty');
                formula.textContent = '';
                return;
            }

            const total = val3 * val4;
            result.textContent = `¥ ${formatNumber(total)}`;
            result.classList.remove('empty');
            formula.textContent = `${formatNumber(val3)} × ${formatNumber(val4)} = ${formatNumber(total)}`;
        }

        // ==================== localStorage 存储 ====================
        function saveToStorage(prefix) {
            try {
                const data = {
                    date1:  document.getElementById(`${prefix}-date1`).value,
                    date2:  document.getElementById(`${prefix}-date2`).value,
                    input1: document.getElementById(`${prefix}-input1`).value,
                    input2: document.getElementById(`${prefix}-input2`).value,
                    input3: document.getElementById(`${prefix}-input3`).value,
                    input4: document.getElementById(`${prefix}-input4`).value,
                    savedAt: new Date().toISOString()
                };
                localStorage.setItem(getStorageKey(prefix), JSON.stringify(data));
                showSaveIndicator(prefix);
            } catch (e) {
                console.error('保存数据失败:', e);
            }
        }

        function showSaveIndicator(prefix) {
            const indicator = document.getElementById(`${prefix}-save-indicator`);
            if (!indicator) return;
            indicator.classList.add('show');
            clearTimeout(indicator._timer);
            indicator._timer = setTimeout(() => indicator.classList.remove('show'), 2000);
        }

        function updateSaveTimeDisplay(prefix) {
            const timeEl = document.getElementById(`${prefix}-save-time`);
            const dotEl = document.getElementById(`${prefix}-save-dot`);
            if (!timeEl || !dotEl) return;
            try {
                const saved = localStorage.getItem(getStorageKey(prefix));
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.savedAt) {
                        timeEl.textContent = formatTimestamp(data.savedAt);
                        timeEl.classList.remove('never');
                        dotEl.classList.add('saved');
                        return;
                    }
                }
            } catch (e) {
                console.error('读取保存时间失败:', e);
            }
            timeEl.textContent = '尚未保存';
            timeEl.classList.add('never');
            dotEl.classList.remove('saved');
        }

        function manualSave(prefix) {
            saveToStorage(prefix);
            updateSaveTimeDisplay(prefix);
        }

        function showRestoreToast() {
            let toast = document.querySelector('.restore-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.className = 'restore-toast';
                toast.textContent = '✓ 已恢复上次保存的数据';
                document.body.appendChild(toast);
            }
            requestAnimationFrame(() => toast.classList.add('show'));
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function restoreFromStorage(prefix) {
            try {
                const saved = localStorage.getItem(getStorageKey(prefix));
                if (!saved) return false;
                const data = JSON.parse(saved);
                if (data.date1 !== undefined) document.getElementById(`${prefix}-date1`).value = data.date1;
                if (data.date2 !== undefined && data.date2) document.getElementById(`${prefix}-date2`).value = data.date2;
                if (data.input1 !== undefined) document.getElementById(`${prefix}-input1`).value = data.input1;
                if (data.input2 !== undefined) document.getElementById(`${prefix}-input2`).value = data.input2;
                if (data.input3 !== undefined) document.getElementById(`${prefix}-input3`).value = data.input3;
                if (data.input4 !== undefined) document.getElementById(`${prefix}-input4`).value = data.input4;
                updateCalc(prefix);
                return true;
            } catch (e) {
                console.error('恢复数据失败:', e);
                return false;
            }
        }

        // ==================== 房间名称编辑 ====================
        function loadRoomName(roomId) {
            const nameEl = document.getElementById(`${roomId}-name`);
            if (!nameEl) return;

            const saved = localStorage.getItem(getRoomNameKey(roomId));
            if (saved) nameEl.textContent = saved;

            nameEl.addEventListener('blur', () => {
                let name = nameEl.textContent.trim();
                if (!name) name = nameEl.dataset.default;
                nameEl.textContent = name;
                localStorage.setItem(getRoomNameKey(roomId), name);
                // 同步更新侧边栏名称
                updateSidebarRoomName(roomId, name);
            });

            nameEl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nameEl.blur();
                }
            });

            nameEl.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData || window.clipboardData).getData('text');
                document.execCommand('insertText', false, text);
            });
        }

        function updateSidebarRoomName(roomId, name) {
            const item = document.querySelector(`.room-list-item[data-room="${roomId}"]`);
            if (item) {
                const nameEl = item.querySelector('.room-list-name');
                if (nameEl) nameEl.textContent = name;
                item.title = name;
            }
        }

        // ==================== 清除/重置 ====================
        function clearRoomData(roomId) {
            const roomName = getRoomName(roomId);
            if (!confirm(`确定要清除「${roomName}」的所有已保存数据吗？此操作不可撤销。`)) return;

            TABS.forEach(tab => {
                const prefix = `${roomId}-${tab}`;
                localStorage.removeItem(getStorageKey(prefix));
                resetForm(prefix);
                updateSaveTimeDisplay(prefix);
            });
        }

        function resetForm(prefix) {
            const isElec = prefix.endsWith('-elec');
            const defaultPrice = isElec ? '0.55' : '2.8';

            document.getElementById(`${prefix}-date1`).value = '';
            document.getElementById(`${prefix}-date2`).value = getToday();
            document.getElementById(`${prefix}-input1`).value = '';
            document.getElementById(`${prefix}-input2`).value = '';
            document.getElementById(`${prefix}-input3`).value = '';
            document.getElementById(`${prefix}-input3`).readOnly = false;
            document.getElementById(`${prefix}-input4`).value = defaultPrice;

            const badge = document.getElementById(`${prefix}-badge3`);
            if (badge) {
                badge.textContent = '手动输入';
                badge.classList.add('manual');
            }

            localStorage.removeItem(getStorageKey(prefix));

            const timeEl = document.getElementById(`${prefix}-save-time`);
            const dotEl = document.getElementById(`${prefix}-save-dot`);
            if (timeEl) {
                timeEl.textContent = '尚未保存';
                timeEl.classList.add('never');
            }
            if (dotEl) dotEl.classList.remove('saved');

            updateResult(prefix);
        }

        // ==================== 初始化单个房间面板 ====================
        function initRoomPanel(roomId) {
            loadRoomName(roomId);

            const today = getToday();
            let restored = false;

            TABS.forEach(tab => {
                const prefix = `${roomId}-${tab}`;

                document.getElementById(`${prefix}-date2`).value = today;

                document.getElementById(`${prefix}-input1`).addEventListener('input', () => updateCalc(prefix));
                document.getElementById(`${prefix}-input2`).addEventListener('input', () => updateCalc(prefix));
                document.getElementById(`${prefix}-input3`).addEventListener('input', () => updateResult(prefix));
                document.getElementById(`${prefix}-input4`).addEventListener('input', () => updateResult(prefix));

                if (restoreFromStorage(prefix)) restored = true;

                updateSaveTimeDisplay(prefix);
                updateResult(prefix);
            });

            return restored;
        }

        // ==================== 初始化 ====================
        function init() {
            loadRoomList();
            loadSelectedRoom();
            loadSidebarState();
            renderAll();

            // 检查是否有恢复的数据
            let anyRestored = false;
            TABS.forEach(tab => {
                const prefix = `${selectedRoomId}-${tab}`;
                if (localStorage.getItem(getStorageKey(prefix))) anyRestored = true;
            });
            if (anyRestored) showRestoreToast();
        }

        init();
    </script>
</body>
</html>
