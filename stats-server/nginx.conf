# Nginx 配置 - 在现有 server 块中添加以下 location
# 文件位置: /etc/nginx/sites-available/aitools (或你的实际配置文件)
#
# 在 server { ... } 块内添加:

    # 统计 API 反代到 Node.js 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 统计仪表盘页面
    location = /stats {
        # 注意：root 是 /var/www/aitools/dist，但 dashboard.html 在 stats-server/ 下
        # 用 alias 直接指定绝对路径，并设置正确的 Content-Type
        alias /var/www/aitools/stats-server/dashboard.html;
        default_type text/html;
    }
